<html lang="en">

  <title>404 — OnionClaw</title>
  <meta name="robots" content="noindex">
  <!-- Self-contained on purpose: hosts serve this file for a missing path at ANY depth,
       so relative asset paths would resolve against the wrong directory, and an absolute
       URL would hard-code a domain. The mark is inline SVG and the only link is
       root-relative, so nothing here can 404 in turn. -->
  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2307050b'/%3E%3Cpath d='M16 6c-1 2-5 4-5 11a5 5 0 0 0 10 0c0-7-4-9-5-11z' fill='%23b98fe0'/%3E%3Cpath d='M16 6c-1 2-5 4-5 11a5 5 0 0 0 5 5V6z' fill='%23f2eef7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Geist+Mono:wght@500&display=swap">
  <style>
    :root { color-scheme: dark; }
    html, body { height: 100%; }
    body { margin: 0; background: radial-gradient(70% 55% at 50% 30%, rgba(125,63,154,.35), transparent 70%), #07050b;
      color: #f2eef7; font: 500 16px/1.6 "Geist Mono", ui-monospace, monospace;
      display: grid; place-content: center; justify-items: center; gap: 20px; text-align: center; padding: 24px; }
    .mark { width: 132px; height: 132px; filter: drop-shadow(0 14px 34px rgba(185,143,224,.5)); animation: bob 5s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-12px); } }
    h1 { font: 800 clamp(48px, 12vw, 96px)/1 "Unbounded", system-ui, sans-serif; margin: 0; letter-spacing: -.03em; }
    p { color: rgba(242,238,247,.6); margin: 0; }
    a { display: inline-block; margin-top: 8px; color: #07050b; background: #34d6c9; text-decoration: none;
      font: 600 14px "Unbounded", system-ui, sans-serif; padding: 12px 22px; border-radius: 10px; }
    a:hover { background: #f2eef7; }
    @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
  </style>
</head>
<body>
  <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="OnionClaw">
    <path d="M16 6c-1 2-5 4-5 11a5 5 0 0 0 10 0c0-7-4-9-5-11z" fill="#b98fe0"/>

    <circle cx="14" cy="17" r="1.3" fill="#0d0a12"/><circle cx="18" cy="17" r="1.3" fill="#34d6c9"/>
  </svg>
  <h1>404</h1>

</body>
