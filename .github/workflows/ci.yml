name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Syntax & import check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install requests[socks] beautifulsoup4 python-dotenv stem openai anthropic google-generativeai pytest stix2 mcp

      - name: Unit tests
        run: python3 -m pytest tests -q

      - name: Syntax check — sicry.py
        run: python3 -m py_compile sicry.py && echo "✓ sicry.py OK"

      - name: Syntax check — every script
        run: |
          # Every file, and the step fails if any one does. The old loop ran
          # `py_compile "$f" && echo ok`, which never trips bash -e, and a loop's
          # status is its last file's: a syntax error anywhere else went green.
          status=0
          for f in *.py tests/*.py; do
            if python3 -m py_compile "$f"; then echo "✓ $f"; else echo "✗ $f"; status=1; fi
          done
          exit $status

      - name: Import check — sicry
        run: python3 -c "import sicry; print('✓ sicry', sicry.__version__, 'imported')"

      - name: Tools schema (no Tor needed)
        run: python3 sicry.py tools --format openai | python3 -c "import sys,json; d=json.load(sys.stdin); print('✓', len(d), 'tools defined')"
